# Scopes, routines, and cadences (records of the hub's config document), and garden proposals.
fixture: 1
kind: gardening
name: hygiene

scopes:
  - {slug: whole-repo, description: Every file in the project's repositories., project: default}
  - {slug: tests, description: The test suites only., project: default}
routines:
  - {slug: dependency-hygiene, name: Dependency hygiene, graph_name: garden-routine,
     default_scope_slug: whole-repo, default_model: [claude-sonnet-5-5], default_harnesses: [claude_code],
     scopes: [whole-repo], project: default}
  - {slug: flaky-tests, name: Flaky tests, graph_name: garden-routine, default_scope_slug: tests,
     default_model: [claude-sonnet-5-5], default_harnesses: [claude_code], scopes: [tests], project: default}
cadences:
  - slug: weekly
    name: Weekly hygiene
    schedule: {cron: "0 6 * * MON", zone: America/Chicago}
    chores:
      - {key: deps, routine: dependency-hygiene, scopes: all, mode: delta}
      - {key: flakes, routine: flaky-tests, scopes: [tests], mode: full, promote: true}
    project: default

proposals:
  - {key: bump-fastapi, routine: dependency-hygiene, class: dependency-update, at: -2d,
     title: Bump fastapi 0.115 to 0.118, body: "Two security advisories fixed upstream; no breaking changes in the changelog."}
  - {key: quarantine-cart-test, routine: flaky-tests, class: flaky-test, at: -1d,
     title: Quarantine test_cart_concurrent_update, body: "Failed 6 of the last 40 runs, always on the same race."}
  - {key: pin-node, routine: dependency-hygiene, class: dependency-update, at: -9d,
     title: Pin Node to 22 LTS, body: {generate: {paragraphs: 1}}, closure: {kind: passed, by: dana, at: -8d}}
  - {key: retry-webhook-test, routine: flaky-tests, class: flaky-test, at: -12d,
     title: Add a retry to test_webhook_delivery, body: {generate: {paragraphs: 1}},
     closure: {kind: accepted, item_outcome: minted, by: lee, at: -11d}}
  - {key: drop-pytest-xdist, routine: dependency-hygiene, class: dependency-update, at: -15d,
     title: Drop pytest-xdist, body: {generate: {paragraphs: 1}}, closure: {kind: accepted, item_outcome: declined, by: dana, at: -14d}}
